name: docker

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: xlings-docker:test

jobs:
  lint:
    name: lint scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-test:
    name: build and smoke (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: read pinned xlings version
        id: version
        run: echo "value=$(sed -n 's/^ARG XLINGS_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            XLINGS_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: smoke tests
        env:
          IMAGE: ${{ env.IMAGE }}
          XLINGS_VERSION: ${{ steps.version.outputs.value }}
          SMOKE_NETWORK: "1"
        run: ./tests/smoke.sh

  build-arm64:
    name: build and check (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: read pinned xlings version
        id: version
        run: echo "value=$(sed -n 's/^ARG XLINGS_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: xlings-docker:arm64
          build-args: |
            XLINGS_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: check the arm64 image
        run: docker run --rm --platform linux/arm64 xlings-docker:arm64 xlings --version

  publish:
    name: publish to GHCR
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.push)
    needs: [lint, build-test, build-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: read pinned xlings version
        id: version
        run: echo "value=$(sed -n 's/^ARG XLINGS_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: image name
        id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.value }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.value }}-ubuntu24.04
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            XLINGS_VERSION=${{ steps.version.outputs.value }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          sbom: true
          provenance: mode=max

      - name: summary
        run: |
          {
            echo "### Published"
            echo
            echo "xlings version: \`${{ steps.version.outputs.value }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
